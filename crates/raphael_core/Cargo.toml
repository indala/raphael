[package]
name = "raphael_core"
version = "0.1.0"
edition = "2021"
description = "Native SIMD acceleration layer for Raphael AI Desktop Assistant"

[lib]
name = "raphael_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
