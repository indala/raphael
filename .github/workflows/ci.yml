name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Decode Code Signing PFX Certificate
        shell: pwsh
        run: |
          $pfxBase64 = "${{ secrets.CERT_PFX_BASE64 }}"
          if ($pfxBase64) {
              [IO.File]::WriteAllBytes("$pwd/raphael_codesign.pfx", [Convert]::FromBase64String($pfxBase64))
              Write-Host "PFX certificate decoded successfully."
          } else {
              Write-Host "WARNING: CERT_PFX_BASE64 secret is not set. Build will skip signing."
          }

      - name: Build with PyInstaller
        run: python build_app.py

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphael-dist
          path: dist/Raphael/

  package:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: raphael-dist
          path: dist/Raphael/

      - name: Decode Code Signing PFX Certificate
        shell: pwsh
        run: |
          $pfxBase64 = "${{ secrets.CERT_PFX_BASE64 }}"
          if ($pfxBase64) {
              [IO.File]::WriteAllBytes("$pwd/raphael_codesign.pfx", [Convert]::FromBase64String($pfxBase64))
              Write-Host "PFX certificate decoded successfully."
          } else {
              Write-Host "WARNING: CERT_PFX_BASE64 secret is not set. Package will skip signing."
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc raphael.iss

      - name: Sign installer
        shell: pwsh
        run: |
          $pfxPath = "$pwd/raphael_codesign.pfx"
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "signtool.exe" -Recurse | Select-Object -First 1
          if ($signtool -and (Test-Path $pfxPath)) {
              Write-Host "Signing installer..."
              & $signtool.FullName sign /f $pfxPath /p "RaphaelCert123" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 installer/Raphael_Setup.exe
              Write-Host "Installer signed successfully."
          } else {
              Write-Host "WARNING: SignTool or PFX file not found. Skipping installer signing."
          }

      - name: Zip installer and release assets
        run: |
          Compress-Archive -Path installer/Raphael_Setup.exe, raphael_public.cer, HOW_TO_INSTALL.md -DestinationPath installer/Raphael_${{ github.ref_name }}_Release.zip -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphael-installer
          path: installer/Raphael_${{ github.ref_name }}_Release.zip

  release:
    needs: package
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: raphael-installer
          path: Output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Raphael_*_Release.zip
          generate_release_notes: true