name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python build_app.py --skip-hybrid

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphael-dist
          path: dist/Raphael/

  package:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: raphael-dist
          path: dist/Raphael/

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc raphael.iss

      # TODO: Add code signing when ready (Azure Trusted Signing, SignPath, or self-signed)
      # - name: Sign installer
      #   run: signtool.exe sign /f "certificate.pfx" /p "${{ secrets.CERT_PASSWORD }}" /t "http://timestamp.digicert.com" /fd SHA256 Output/RaphaelSetup.exe

      - name: Zip installer for release
        run: Compress-Archive -Path Output/RaphaelSetup.exe -DestinationPath Output/RaphaelSetup.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphael-installer
          path: Output/RaphaelSetup.zip

  release:
    needs: package
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: raphael-installer
          path: Output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/RaphaelSetup.zip
          generate_release_notes: true