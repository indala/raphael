[project]
name = "raphael"
version = "0.1.0"
description = "AI orchestrator with multi-provider support"
requires-python = ">=3.11"

# ── Ruff: linter + formatter ──────────────────────────────────────────

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (caught missing imports, undefined names)
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify
    "ARG",  # unused arguments
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long — enforced by formatter
    "B904",   # raise-without-from-inside-except — acceptable in simple cases
]
unfixable = ["I"]   # imports already sorted; prevent churn

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # unused imports in __init__.py re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── mypy: type checking ───────────────────────────────────────────────

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
warn_no_return = true
warn_unreachable = true

# Start strict on core modules, relax for the rest
[[tool.mypy.overrides]]
module = "orchestrator.*"
disallow_untyped_defs = false
check_untyped_defs = true
